aid: worknmates
name: Worknmates
description: Worknmates, now operating as OFFI (getoffi.com), is a Latin American
  flexible-workspace marketplace. Companies give employees budgets to book coworking
  spaces, offices, and work-ready apartments near where they live, with real-time
  transaction tracking, per-city budgets, and approved-space networks; hosts list
  and monetize their spaces, with payouts through dLocal and PayPal. A 500 Global
  portfolio company. No public developer program or documented API is published.
